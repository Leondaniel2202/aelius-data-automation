name: Build SeaTable automations
on:
  push:
    branches: [main]
    paths: ['automation/**', '.github/workflows/automation.yml']
  pull_request:
    paths: ['automation/**', '.github/workflows/automation.yml']
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s automation/tests -v
      - name: Bundle scripts
        run: python automation/build/bundle.py
      - name: Upload standalone scripts
        uses: actions/upload-artifact@v4
        with:
          name: seatable-automation-scripts
          path: automation/dist/*.py
